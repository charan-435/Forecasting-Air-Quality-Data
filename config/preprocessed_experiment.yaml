# CPCB parallel preprocessed experiment (architectures B0, A1, B1, B2, B3).
#   Rscript run_preprocessed_experiment.R <phase>
# Every output goes to store/preprocessed_experiment/ and results/preprocessed_experiment/.
# Shared configs, stores and results are read only.

experiment: cpcb_preprocessed_v1
station: CPCB
target: PM2.5
pollutants: [PM2.5, PM10, NO2, SO2, O3, CO]
tz: Asia/Kolkata
seed: 7

source:
  series: store/clean/series.parquet   # kaisen Phase 1a store (CPCB stored as-is)
  raw_csv: data/raw/CPCB.csv            # audit only

paths:
  store: store/preprocessed_experiment
  results: results/preprocessed_experiment

# The task names an "existing S3 split". kaisen @ 38daa41 has none (no split
# config, no get_origins(); chrono_split() is deprecated, AUDIT F3). PE-S3 is a
# documented substitute: chronological, block = month boundaries, each block
# keyed by the TARGET timestamp t + h. Checked against target availability in
# the Phase 1 audit (data_audit/split_availability.csv).
split:
  name: PE-S3
  train_end: "2023-02-28 23:00"   # last training target
  val_end: "2023-04-30 23:00"     # last validation target; test = later targets

forecast:
  horizon_h: 24        # only horizon run here; configurable
  n_lags: 24           # lag1 = y[t] (most recent), lag24 = y[t-23]
  season: 24           # MASE denominator period (training block only)

validity:
  # 1. Fill codes: a complete six-pollutant vector occurring at >= 2 distinct
  #    hours of the TRAINING block is a synthetic fill (sensor readings at 6+
  #    decimals never repeat jointly). Learned on training, applied everywhere.
  fill_code_min_hours: 2
  # 2-5 reuse kaisen config/preprocess.yaml (audited, not edited):
  #    negative -> NA; outside `bounds` -> NA; stuck >= stuck_hours (causal) -> NA;
  #    PM2.5 > pm_ratio_max * PM10 -> NA on both. Spikes: flag only (spike.mask false).
  action: na           # invalid values become NA; nothing is clipped to a bound

imputation:
  # kaisen causal fills (R/22_impute.R), method per variable and gap bucket
  # chosen by kaisen's artificial-gap benchmark on the TRAINING block only.
  # Only the parameter-free, past-only methods are allowed: M1 last value,
  # M2/M3 same hour 24 h / 168 h earlier, M4 M1-then-M2, M5/M6 trailing 28-day
  # hour-of-day climatology. M7 (Kalman on training-fitted hour means) and M8
  # (regression fitted on the training block) fill early hours with information
  # from later observations, which the task forbids; they also produced negative CO.
  n_artificial_gaps: 500
  methods: [M1, M2, M3, M4, M5, M6]
  fallback: M4

decomposition:
  method_id: mra_haar_J5      # config/decomp.yaml entry (trailing family)
  scale: raw                  # -> mra_haar_J5__raw
  # window_h, J, filter, pad are read from config/decomp.yaml at run time.

# Starting point: kaisen's LightGBM screen config (config/decomp.yaml: regression_l1,
# num_leaves 31, learning_rate 0.05, min_data_in_leaf 50, feature_fraction 0.8, seed 7).
# The grid spans it; validation picks per architecture (per component for B0/B2).
lightgbm:
  objective: regression_l1
  feature_fraction: 0.8
  num_threads: 1
  seed: 7
  deterministic: true
  max_rounds: 3000
  early_stopping_rounds: 100
  grid:
    num_leaves: [15, 31, 63]
    learning_rate: [0.03, 0.1]
    min_data_in_leaf: [20, 50, 100]

architectures:
  run: [B0, A1, B1, B2, B3]
  # B2/B3 covariates at the origin only: same_level = the other five pollutants'
  # component of the target's level (5 features); all_levels = all six components
  # of each other pollutant (30). Chosen on validation.
  covariate_sets: [same_level, all_levels]
  # Shared models (B1, B3): rows weighted by their component's training sd, so the
  # L1 loss on standardised targets equals the sum of original-unit component errors.
  shared_weighting: component_sd
  datasets: [clean, unmasked]   # unmasked = control for research questions 1 and 10

comparison:
  bootstrap_reps: 2000
  block_length: 24     # moving-block bootstrap over time-ordered test targets
  dm_lag: 23           # Newey-West lag h - 1 for the Diebold-Mariano test
