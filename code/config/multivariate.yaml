# Multivariate forecasting, Phase 1: raw designs B0 and B1.
# Primary experiment is UNMASKED: every aligned hour is kept, including the
# 2,304 upstream constant-fill hours documented in results/multivariate/phase0.
#   Rscript code/tests/multivariate/run_tests.R
#   Rscript code/experiments/run_multivariate.R            # smoke: B0 + B1, LightGBM, h = 24

experiment: phase1_b0_b1

data:
  source: data/processed/store/clean/series.parquet
  value_column: value_filled_causal
  station: CPCB
  timezone: Asia/Kolkata
  pollutants: [PM2.5, PM10, NO2, SO2, O3, CO]      # fixed order, used for columns
  units: {PM2.5: ug/m3, PM10: ug/m3, NO2: ug/m3, SO2: ug/m3, O3: ug/m3, CO: mg/m3}
  expected_n_hours: 8880
  expected_start: "2022-07-01 00:00"
  expected_end: "2023-07-05 23:00"

quality_mask: none          # intentional: no target, origin or row exclusion

target: PM2.5
lookback_h: 24              # lags 00..23 = values at t, t-1, ..., t-23
horizons: [24, 168, 336, 744]
strategy: direct_fixed_horizon   # one model per horizon; strategy comparison deferred

split:
  name: S3
  first_origin: "2022-09-25 06:00"
  blocks:
    train:      {start: "2022-09-24 07:00", end: "2023-01-31 23:00"}
    validation: {start: "2023-02-01 00:00", end: "2023-04-03 23:00"}
    test:       {start: "2023-04-04 00:00", end: "2023-07-05 23:00"}
  # Final refit = train samples + validation samples (each inside its own block).

designs:
  B0: {pollutants: [PM2.5]}
  B1: {pollutants: [PM2.5, PM10, NO2, SO2, O3, CO]}

model:
  family: lightgbm
  seed: 2026
  # Starting configuration taken from T1. Not tuned for multivariate inputs.
  params:
    objective: regression
    learning_rate: 0.05
    num_iterations: 160
    max_depth: 6
    num_leaves: 31
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    early_stopping_rounds: 30
    num_threads: 1

metrics:
  season: 24
  mase_scale_block: train   # seasonal-naive MAE on the train-block PM2.5 series
  bootstrap:
    method: moving_block
    block_h: 168
    reps: 999
    seed: 7
    level: 0.95

smoke:
  designs: [B0, B1]
  horizons: [24]
  family: lightgbm

output_dir: results/multivariate/phase1
