# Multivariate forecasting, Phase 2: complete raw B0 / B1 experiments (CPCB).
# Data, split, designs, horizons and lookback come from code/config/multivariate.yaml
# (unchanged). This file only holds the experiment matrix.
# All results are UNMASKED (quality_mask: none in the base config).
#   Rscript code/experiments/run_mv_experiments.R --stage=check
#   Rscript code/experiments/run_mv_experiments.R --stage=smoke
#   Rscript code/experiments/run_mv_experiments.R --stage=model --family=lightgbm      # Stage A
#   Rscript code/experiments/run_mv_experiments.R --stage=model --family=xgboost       # Stage B (one per family)
#   Rscript code/experiments/run_mv_experiments.R --stage=featsel                      # Stage C
#   Rscript code/experiments/run_mv_experiments.R --stage=targets                      # six targets, separate vs shared
#   Rscript code/experiments/run_mv_experiments.R --stage=report

experiment: phase2_b0_b1_full
base_config: code/config/multivariate.yaml
output_dir: results/multivariate/phase2

target: PM2.5
designs: [B0, B1]
horizons: [24, 168, 336, 744]

seeds: [2026, 2027, 2028, 2029, 2030]   # final fits of stochastic families
tuning_seed: 2026                        # one seed for the validation grid search
selection_metric: MAE                    # validation MAE of the train-only fit; test never used

bootstrap:
  reps: 999
  seed: 7
  level: 0.95
  min_block_h: 24          # diurnal cycle: shortest block that keeps a full day together
  min_blocks: 5            # cap: at least 5 blocks must fit in the evaluated sample
  sensitivity_blocks: [24, 168, 336, 744]

families:
  lightgbm:
    transform: identity
    base: {objective: regression, learning_rate: 0.05, num_iterations: 3000,
           early_stopping_rounds: 50, max_depth: -1, bagging_fraction: 0.8,
           bagging_freq: 1, num_threads: 1}
    grid:
      num_leaves: [7, 15, 31]
      min_data_in_leaf: [20, 100]
      feature_fraction: [0.5, 0.8]
      lambda_l2: [0, 10]
    extra_candidates:      # the Phase 1 smoke configuration, kept for traceability
      smoke: {objective: regression, learning_rate: 0.05, num_iterations: 160, max_depth: 6,
              num_leaves: 31, feature_fraction: 0.8, bagging_fraction: 0.8, bagging_freq: 1,
              early_stopping_rounds: 30, num_threads: 1}
  xgboost:
    transform: identity
    base: {eta: 0.05, num_iterations: 3000, early_stopping_rounds: 50, subsample: 0.8,
           tree_method: hist}
    grid:
      max_depth: [3, 6]
      min_child_weight: [1, 20]
      colsample_bytree: [0.5, 0.8]
      lambda: [1, 10]
  catboost:
    transform: identity
    base: {learning_rate: 0.05, num_iterations: 3000, early_stopping_rounds: 50}
    grid:
      depth: [4, 6]
      l2_leaf_reg: [3, 10]
  ridge:
    transform: standardize
    base: {alpha: 0, nlambda: 100, lambda_min_ratio: 0.0001}
    grid: {}
  lasso:
    transform: standardize
    base: {alpha: 1, nlambda: 100, lambda_min_ratio: 0.0001}
    grid: {}
  elasticnet:
    transform: standardize
    base: {nlambda: 100, lambda_min_ratio: 0.0001}
    grid:
      alpha: [0.1, 0.5, 0.9]

# Stage C: feature selection / dimensionality reduction on B1 (PM2.5).
# Chosen after Stage A/B (see REPORT.md section 5 for the justification).
# The tree learner starts from the Stage A B1 configuration of each horizon;
# k / components are chosen on validation with it, then `retune_grid` is
# searched on validation at the chosen k. Linear learners pick their own penalty.
featsel:
  tree_family: lightgbm
  retune_grid: {num_leaves: [7, 15, 31], min_data_in_leaf: [20, 100]}
  ablation: true                      # B0 + one pollutant, B1 minus one pollutant
  corr_k: [12, 24, 48, 72, 96]
  mi_k: [12, 24, 48, 72, 96]
  mi_bins: 16
  enet_select: true                   # (alpha, lambda) frozen from Stage B elastic net, B1
  rfe: {drop_frac: 0.2, min_features: 6}
  pca_k: [2, 4, 8, 16, 24, 32, 48]
  pls_scores_k: [2, 4, 8, 16]
  pls_max_ncomp: 30

# Six targets: separate target-specific models vs one shared (pooled) model.
targets:
  pollutants: [PM2.5, PM10, NO2, SO2, O3, CO]
  family: lightgbm
  base: {objective: regression, learning_rate: 0.05, num_iterations: 3000,
         early_stopping_rounds: 50, max_depth: -1, bagging_fraction: 0.8,
         bagging_freq: 1, num_threads: 1, feature_fraction: 0.8, lambda_l2: 10}
  grid: {num_leaves: [7, 15, 31], min_data_in_leaf: [20, 100]}
  pooled_variants: [pooled_B1_own, pooled_B1, pooled_B0]
